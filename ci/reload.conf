# The part of the reload test that differs per module.  ci/reload.sh sources
# this with $WORK and $PORT already set and then drives the reloads.

# This module's own block sits outside http{}, so it goes in through
# RELOAD_MAIN.  Appending it to the configuration file from here would not
# work: ci/reload.sh sources this before it writes that file.
RELOAD_MAIN="
rtmp {
    server {
        listen 127.0.0.1:$((PORT + 1));
        application reload-probe-app {
            live on;
        }
    }
}"

RELOAD_HTTP=""

RELOAD_SERVER="
        location /probe {
            rtmp_stat all;
        }"

# rtmp_stat answers with the module's own XML, listing the application
# above.  A reload that left the module without its per-cycle state would
# still answer 200 -- with an empty document or none at all -- so the probe
# asks for something only this module can produce.
RELOAD_EXPECT='reload-probe-app'

reload_probe() {
	curl -s --max-time 5 "http://127.0.0.1:$PORT/probe" |
		sed -n 's/.*<name>\(reload-probe-app\)<\/name>.*/\1/p' | head -1
}
